<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodWagon</title>

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">


    <!-- Google Fonts: Outfit + Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">


    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NavBar -->
    <nav class="navBar">

        <div class="navLogo">
            <img src="./assets/Logo.png" alt="Logo">
        </div>

        <div class="navLocation">
            <span>Deliver to:</span> <i class="fa-solid fa-location-dot"></i>
            Current Location <span>Muhammadpur Bus Stand, Dhaka</span>
        </div>

        <div class="navBtns">
            <button class="search"><i class="fa-solid fa-magnifying-glass"></i>Search Food</button>
            <button class="login"><i class="fa-solid fa-user"></i>Login</button>
        </div>

    </nav>

    <!-- Hero Section -->
    <section class="container">

        <div class="text">

            <h1 class="open-sans">Are you starving?</h1>
            <p class="Within">Within a few clicks, find meals that are accessible near you</p>

            <!-- Food Search Box -->
            <div class="food-search-box">

                <!-- Delivery and Pickup Tabs -->
                <div class="food-tabs">
                    <button class="food-tab active">
                        <i class="fa-solid fa-motorcycle"></i>
                        Delivery
                    </button>

                    <button class="food-tab">
                        <i class="fa-solid fa-bag-shopping"></i>
                        Pickup
                    </button>
                </div>

                <!-- Address Input and Find Food Button -->
                <div class="food-search-form">
                    <div class="address-input">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" placeholder="Enter Your Address">
                    </div>

                    <button class="find-food-btn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        Find Food
                    </button>

                </div>
            </div>
        </div>

        <div>
            <img class="hero-pic" src="./assets/Image.png" alt="">
        </div>
</body>

</html>
